name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Checkout with submodules (Runestone framework)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install Go (required for building Libbox.xcframework)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Build Libbox.xcframework from sing-box source using sagernet's gomobile fork
      - name: Build Libbox.xcframework
        run: |
          SING_BOX_VERSION="v1.14.0-alpha.8"

          # Clone sing-box source at the matching version
          git clone --depth 1 --branch "$SING_BOX_VERSION" \
            https://github.com/SagerNet/sing-box.git /tmp/sing-box-src

          cd /tmp/sing-box-src

          # Install sagernet's gomobile fork (required by sing-box, not the official golang.org/x/mobile)
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          gomobile init

          # Exact tags from sing-box's cmd/internal/build_libbox/main.go
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird,with_low_memory,with_dhcp,grpcnotrace"

          # Build xcframework for iOS only (skip simulator/tvos/macos to save time)
          gomobile bind \
            -v \
            -target ios \
            -libname=box \
            -tags-not-macos=with_low_memory \
            -trimpath \
            -buildvcs=false \
            -tags "$TAGS" \
            -o "$GITHUB_WORKSPACE/Libbox.xcframework" \
            ./experimental/libbox

          echo "Libbox.xcframework built successfully."
          ls "$GITHUB_WORKSPACE/Libbox.xcframework/"

      # Generate self-signed certificate and set up temporary Keychain
      - name: Set up self-signed certificate
        run: |
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/ci.key \
            -out /tmp/ci.crt \
            -days 1 -nodes \
            -subj "/CN=CI Self-Signed/O=CI/C=US"

          openssl pkcs12 -export \
            -out /tmp/ci.p12 \
            -inkey /tmp/ci.key \
            -in /tmp/ci.crt \
            -passout pass:ci_password

          security create-keychain -p ci_keychain_password ci-build.keychain
          security default-keychain -s ci-build.keychain
          security unlock-keychain -p ci_keychain_password ci-build.keychain
          security set-keychain-settings -t 3600 -u ci-build.keychain

          security import /tmp/ci.p12 \
            -k ci-build.keychain \
            -P ci_password \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k ci_keychain_password ci-build.keychain

      # Fix Localizable.xcstrings encoding — Xcode 16 requires valid UTF-8 JSON
      - name: Fix Localizable.xcstrings
        run: |
          # Re-encode as clean UTF-8 without BOM using Python
          python3 -c "
          import json, sys
          with open('Localizable.xcstrings', 'rb') as f:
              raw = f.read()
          # Strip BOM if present
          if raw.startswith(b'\xef\xbb\xbf'):
              raw = raw[3:]
          # Validate JSON and re-write as clean UTF-8
          data = json.loads(raw.decode('utf-8'))
          with open('Localizable.xcstrings', 'w', encoding='utf-8', newline='\n') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('Localizable.xcstrings re-encoded as clean UTF-8')
          "

      # xcodebuild archive — disable provisioning profile requirements
      - name: Archive
        run: |
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -archivePath /tmp/sing-box.xcarchive \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="CI Self-Signed" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty || true

          if [ ! -d "/tmp/sing-box.xcarchive" ]; then
            echo "Archive failed. Last 50 lines of build log:"
            tail -50 /tmp/xcodebuild.log
            exit 1
          fi
          echo "Archive succeeded."

      # Package xcarchive into IPA (bypasses exportArchive profile requirement)
      - name: Package IPA
        run: |
          APP_PATH=$(find /tmp/sing-box.xcarchive/Products -name "*.app" | head -1)
          echo "Found app: $APP_PATH"

          mkdir -p /tmp/ipa-output/Payload
          cp -r "$APP_PATH" /tmp/ipa-output/Payload/

          cd /tmp/ipa-output
          zip -r "sing-box.ipa" Payload/
          echo "IPA created:"
          ls -lh /tmp/ipa-output/sing-box.ipa

      # Upload IPA as artifact with commit SHA in name
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ github.sha }}
          path: /tmp/ipa-output/sing-box.ipa
          retention-days: 7
          if-no-files-found: error

      # Clean up temporary keychain (always runs)
      - name: Clean up keychain
        if: always()
        continue-on-error: true
        run: |
          security delete-keychain ci-build.keychain || true
          rm -f /tmp/ci.key /tmp/ci.crt /tmp/ci.p12
