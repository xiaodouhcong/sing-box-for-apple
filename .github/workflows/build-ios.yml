name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Checkout with submodules (Runestone framework)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Download Libbox.xcframework from sing-box releases
      # Version must match the app's MARKETING_VERSION (1.14.0)
      - name: Download Libbox.xcframework
        run: |
          SING_BOX_VERSION="1.14.0"
          DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/Libbox.xcframework.zip"
          echo "Downloading Libbox.xcframework v${SING_BOX_VERSION}..."
          curl -L "$DOWNLOAD_URL" -o /tmp/Libbox.xcframework.zip
          unzip -q /tmp/Libbox.xcframework.zip -d .
          echo "Libbox.xcframework downloaded and extracted."
          ls Libbox.xcframework/

      # Generate self-signed certificate and set up temporary Keychain
      - name: Set up self-signed certificate
        run: |
          # Generate RSA private key and self-signed certificate
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/ci.key \
            -out /tmp/ci.crt \
            -days 1 -nodes \
            -subj "/CN=CI Self-Signed/O=CI/C=US"

          # Export as p12
          openssl pkcs12 -export \
            -out /tmp/ci.p12 \
            -inkey /tmp/ci.key \
            -in /tmp/ci.crt \
            -passout pass:ci_password

          # Create temporary keychain
          security create-keychain -p ci_keychain_password ci-build.keychain
          security default-keychain -s ci-build.keychain
          security unlock-keychain -p ci_keychain_password ci-build.keychain
          security set-keychain-settings -t 3600 -u ci-build.keychain

          # Import certificate into keychain
          security import /tmp/ci.p12 \
            -k ci-build.keychain \
            -P ci_password \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Allow codesign to access the key without UI prompt
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k ci_keychain_password ci-build.keychain

      # xcodebuild archive — disable provisioning profile requirements
      - name: Archive
        run: |
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -archivePath /tmp/sing-box.xcarchive \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="CI Self-Signed" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty || true

          # Verify archive was created
          if [ ! -d "/tmp/sing-box.xcarchive" ]; then
            echo "Archive failed. Last 50 lines of build log:"
            tail -50 /tmp/xcodebuild.log
            exit 1
          fi
          echo "Archive succeeded."

      # Package xcarchive into IPA manually (bypasses exportArchive profile check)
      - name: Package IPA
        run: |
          APP_PATH=$(find /tmp/sing-box.xcarchive/Products -name "*.app" | head -1)
          echo "Found app: $APP_PATH"

          mkdir -p /tmp/ipa-output/Payload
          cp -r "$APP_PATH" /tmp/ipa-output/Payload/

          cd /tmp/ipa-output
          zip -r "sing-box.ipa" Payload/
          echo "IPA created: /tmp/ipa-output/sing-box.ipa"
          ls -lh /tmp/ipa-output/sing-box.ipa

      # Upload IPA as artifact with commit SHA in name
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ github.sha }}
          path: /tmp/ipa-output/sing-box.ipa
          retention-days: 7
          if-no-files-found: error

      # Clean up temporary keychain (always runs)
      - name: Clean up keychain
        if: always()
        continue-on-error: true
        run: |
          security delete-keychain ci-build.keychain || true
          rm -f /tmp/ci.key /tmp/ci.crt /tmp/ci.p12
