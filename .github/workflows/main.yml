 name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild \
          -project sing-box.xcodeproj \
          -scheme SFI \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Release-iphoneos/SFI.app Payload/
          zip -r SingBox.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SingBox-IPA
          path: SingBox.ipa
